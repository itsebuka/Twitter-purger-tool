name: Twitter 24/7 Cloud Purger

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  schedule:
    - cron: '0 */3 * * *' # Runs automatically every 3 hours

permissions:
  contents: write

jobs:
  run-purger:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max execution time per job (~5.8 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git for Auto-Commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Background Purge
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0_CSRF: ${{ secrets.CT0_CSRF }}
          CUTOFF_DATE: ${{ secrets.CUTOFF_DATE }}
        run: |
          python async_purge.py --auto

      - name: Save & Push Progress
        if: always()
        run: |
          git pull --rebase origin main || true
          if [ -f purge_progress.json ]; then
            git add purge_progress.json
            git diff --staged --quiet || (git commit -m "chore: auto-save purge progress [skip ci]" && git push origin main)
          fi
