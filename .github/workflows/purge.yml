name: Twitter 24/7 Cloud Purger

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 */3 * * *' # Automatically runs every 3 hours
  push:
    branches: [ main ]
    paths-ignore:
      - 'purge_progress.json'
      - 'README.md'

concurrency:
  group: twitter-cloud-purger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-purger:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git for Auto-Commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Background Purge
        env:
          AUTH_TOKEN: ${{51c752155f1489e7a36ed3595bb4a68ded7bf42d }}
          CT0_CSRF: ${{a21abe5bf24a95c8a2f9d2483a8c7001eafbbaf152226c3effa1f61a56d53c51633b820ef80398ba8b122645dcc20d5946cfaa626f28f083e0f23d9cc18ad229fb2024360280a4194ae7172e3a62fa42 }}
        run: |
          python async_purge.py --auto

      - name: Save & Push Progress
        if: always()
        run: |
          git pull --rebase origin main || true
          if [ -f purge_progress.json ]; then
            git add purge_progress.json
            git diff --staged --quiet || (git commit -m "chore: save purge progress [skip ci]" && git push origin main)
          fi
